const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:bytes(BLOB.salt),iterations:BLOB.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(BLOB.iv)},key,bytes(BLOB.ct));
  const html=new TextDecoder().decode(out);
  try{localStorage.setItem(KEY,code)}catch(e){}
  document.open();document.write(html);document.close();
}

let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
